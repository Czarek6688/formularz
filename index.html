<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form autocomplete="on">
      <legend>Informacje o kliencie</legend>
      <label for="name">Imię i nazwisko</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Wpisz swoje imię"
        autofocus
        required
      />
      <section>
        <br />
        <label for="phone">Numer telefonu</label>
        <input type="tel" placeholder="1-234-567-8910" id="phone" name="phone" required/>
        
      </section>

      <section>
        <br />
        <label for="email">Adres email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="np: jankowal@gmail.com"
          multiple
        />
      </section>

      <legend>Książki</legend>

      <label for="books">
        <select name="books" name="books" id="books">
          <option value="Lalka">Lalka</option>
          <option value="Wesele">Wesele</option>
          <option value="Balladyna">Balladyna</option>
          <option value="Potop">Potop</option>
          <option value="Latarnik">Latarnik</option>
        </select>

        <label for="quanity">Ilość</label>
        <input type="number" name="quanity" id="quanity" min="1" max="5"> 
          <option value="1"></option>
          <option value="2"></option>
          <option value="3"></option>
          <option value="4"></option>
          <option value="5"></option>
        </input>
      </label>
      <input type="submit" value="Wyślij!" />
    </form>
  </body>
</html>
